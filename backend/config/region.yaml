# RegionScore 설정
# RegionScore = 1 - (avg·평균 + max·최대 + std·표준편차)   (각 지표는 후보 간 min-max 정규화)
# 세 가중치의 합은 1이어야 한다.
weights:
  avg: 0.4   # 평균 이동시간 (효율성)
  max: 0.3   # 최대 이동시간 (과도한 부담 방지)
  std: 0.3   # 이동시간 표준편차 (공정성)

# 참여자 출발지 중심점에서 가까운 역 K개만 후보로 평가한다.
# 1단계는 그래프 추정이라 K가 커져도 API 호출은 늘지 않는다
candidate_k: 20

# 1단계(그래프 추정) 점수로 뽑아 2단계(경로 API)로 확인할 후보 수. 지하철 그래프에는 버스가 없어서,
# 버스가 유리한 지역이 1단계에서 탈락하지 않도록 최종 개수(top_n)보다 넓게 잡는다.
# 환경변수 SHORTLIST_SIZE로 덮어쓸 수 있다.
shortlist_size: 8

# 최종적으로 응답에 포함할 상위 지역 수
top_n: 3
