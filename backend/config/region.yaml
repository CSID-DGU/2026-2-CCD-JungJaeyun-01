# RegionScore 설정
# RegionScore = 1 - (avg·평균 + max·최대 + std·표준편차)   (각 지표는 후보 간 min-max 정규화)
# 세 가중치의 합은 1이어야 한다.
weights:
  avg: 0.4   # 평균 이동시간 (효율성)
  max: 0.3   # 최대 이동시간 (과도한 부담 방지)
  std: 0.3   # 이동시간 표준편차 (공정성)

# 참여자 출발지 중심점에서 가까운 역 K개만 후보로 평가한다.
# 1단계는 그래프 추정이라 K가 커져도 API 호출은 늘지 않는다
candidate_k: 20

# 1단계(그래프 추정) 점수로 뽑아 2단계(경로 API)로 확인할 후보 수. 지하철 그래프에는 버스가 없어서,
# 버스가 유리한 지역이 1단계에서 탈락하지 않도록 최종 개수(top_n)보다 넓게 잡는다.
# 환경변수 SHORTLIST_SIZE로 덮어쓸 수 있다.
shortlist_size: 8

# 최종적으로 응답에 포함할 상위 지역 수
top_n: 3

# 화면에 보이는 "이동 공정성 높음/보통/낮음": 가장 오래 걸리는 사람과 가장 적게 걸리는 사람의 이동시간 차이(분).
# (잠정값. 05-evaluation-plan.md의 사용자 평가로 조정한다. 평가 실험에서 MeetPick 추천은 2~3명일 때 차이 3분 안팎, 대표 번화가는 20분 이상이었다)
fairness_levels:
  high_gap_max: 5
  mid_gap_max: 12

# 공정성(RegionScore)과 장소 만족도가 갈릴 때의 규칙 (scoring/picks.py, docs/evaluation/07-conflict-rule.md)
#   공평 추천 = RegionScore 1위, 장소 만족 추천 = 아래 한도 안에서 장소 만족도가 가장 높은 지역
picks:
  tolerance_score: 0.10     # RegionScore가 1위보다 이만큼 넘게 낮은 지역은 제외
  max_extra_minutes: 8      # 최대 이동시간이 1위보다 이만큼 넘게 긴 지역은 제외
  quality_top_n: 3          # 장소 만족도 = 지역 안 상위 N곳 PlaceScore 평균
