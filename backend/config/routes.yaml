# 경로 API(Google Routes) 호출 설정
# 약속 시간 기본값: 다음 토요일 오후 6시 (KST). 경로는 이 시각에 '도착'하는 기준(arrivalTime)으로 구한다.
meeting:
  default_weekday: 5     # 0=월 ... 5=토
  default_hour: 18
  utc_offset_hours: 9
# TRANSIT 요청에서 허용할 대중교통 수단 (버스 포함)
transit_modes: [BUS, SUBWAY, TRAIN, LIGHT_RAIL]
cache_ttl_days: 7
# 하루에 Google을 실제로 호출할 수 있는 최대 횟수 (matrix + route, 재시도 포함). 넘으면 추정값으로 표시한다.
daily_call_limit: 200
retry:
  max_retries: 1      # 일시 오류(네트워크·5xx·429)만 재시도, 최대 1회
  backoff_seconds: 0.6
timeout_seconds: 15
# 키 제한·API 미사용·할당량 같이 바로 재시도해도 소용없는 오류가 나면 이 시간 동안 호출을 멈추고 추정값을 쓴다.
cooldown_seconds: 120
