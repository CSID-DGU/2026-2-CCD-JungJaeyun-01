# 경로 API(Google Routes) 호출 설정
departure:
  hour: 18            # 출발 시각: 다음 평일 오후 6시 (KST). 캐시 키의 요일·시간대도 여기서 정해진다.
  utc_offset_hours: 9
# TRANSIT 요청에서 허용할 대중교통 수단 (버스 포함)
transit_modes: [BUS, SUBWAY, TRAIN, LIGHT_RAIL]
cache_ttl_days: 7
retry:
  max_retries: 1      # 일시 오류(네트워크·5xx·429)만 재시도, 최대 1회
  backoff_seconds: 0.6
timeout_seconds: 15
# 키 제한·API 미사용·할당량 같이 바로 재시도해도 소용없는 오류가 나면 이 시간 동안 호출을 멈추고 추정값을 쓴다.
cooldown_seconds: 120
