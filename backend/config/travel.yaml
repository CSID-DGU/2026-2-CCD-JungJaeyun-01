# 이동시간 추정 파라미터 (mock 구현 + ODsay 근거리 도보 보정에 사용)
mock:
  detour_factor: 1.3              # 직선거리 → 실제 이동거리 보정 계수
  transit_speed_kmh: 28           # 대중교통 평균 속도 (정차 포함)
  access_minutes: 8               # 역까지 도보 + 승강장 대기
  transfer_every_km: 8            # 이 거리마다 환승 1회로 가정
  transfer_penalty_minutes: 5     # 환승 1회당 추가 시간
  max_transfers: 2
  walk_speed_kmh: 4.5
  walk_threshold_km: 0.7          # 직선거리가 이보다 짧으면 도보로 계산

odsay:
  timeout_seconds: 10
  min_interval_seconds: 0.3       # 실제 HTTP 요청 사이 최소 간격 (순차 호출)
  retry_delays_seconds: [1, 2]    # 429 응답 시 대기 후 재시도 (최대 2회)
