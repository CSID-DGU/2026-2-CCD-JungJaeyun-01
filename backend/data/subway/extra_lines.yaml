# 서울교통공사 CSV(1~8호선 서울교통공사 구간)에 없는 노선·구간. 노선도 기준으로 역 순서를 직접 입력했다.
# 각 항목은 한 방향으로 이어지는 역 목록이며, 이미 있는 역(같은 노선·같은 이름)과는 자동으로 이어진다.
# 소요시간은 공식 데이터가 없어 거리 기반으로 추정한다 (README 참고). 역명은 '역'을 뺀 이름.
# 카카오 검색에서 찾지 못한 역은 건너뛰고 앞뒤 역을 직접 잇는다.

